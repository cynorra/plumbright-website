<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" style="background:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <!-- Blueprint Background Grid -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#grad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Outer Technical Blueprint Border -->
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="25" y="25" width="750" height="400" fill="none" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Corner Crop Marks -->
  <path d="M 15 20 L 30 20 M 20 15 L 20 30" stroke="#2563eb" stroke-width="2"/>
  <path d="M 785 20 L 770 20 M 780 15 L 780 30" stroke="#2563eb" stroke-width="2"/>
  <path d="M 15 430 L 30 430 M 20 435 L 20 420" stroke="#2563eb" stroke-width="2"/>
  <path d="M 785 430 L 770 430 M 780 435 L 780 420" stroke="#2563eb" stroke-width="2"/>

  <!-- Header Category & Brand Badge -->
  <g transform="translate(45, 55)">
    <rect x="0" y="0" width="180" height="28" rx="6" fill="#2563eb" opacity="0.15"/>
    <text x="12" y="19" fill="#2563eb" font-size="12" font-weight="800" letter-spacing="1.5">PLUMBRIGHT // FIELD GUIDE</text>
    
    <text x="0" y="58" fill="#f8fafc" font-size="28" font-weight="900" letter-spacing="-0.5">PAINT & COATINGS</text>
    <text x="0" y="82" fill="#94a3b8" font-size="14" font-weight="500">Wall & Ceiling Gallons, Primer Math & Surface Coverage</text>
  </g>

  <!-- Spec Badge Top Right -->
  <g transform="translate(580, 55)">
    <rect x="0" y="0" width="175" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#2563eb"/>
    <text x="35" y="22" fill="#f8fafc" font-size="12" font-weight="700">350 Sq Ft / Gallon</text>
  </g>

  <!-- Central Technical Graphic -->
  
      <!-- Paint Roller and Swatch -->
      <rect x="240" y="180" width="320" height="80" fill="#1e3a8a" rx="4"/>
      <!-- Roller Handle -->
      <rect x="385" y="270" width="30" height="70" fill="#94a3b8" rx="2"/>
      <rect x="390" y="340" width="20" height="60" fill="#1e293b" rx="4"/>
      <!-- Wet Paint Stroke -->
      <path d="M 240,200 C 320,185 450,215 560,195 L 560,240 C 450,260 320,230 240,245 Z" fill="#3b82f6"/>
      <text x="400" y="415" fill="#93c5fd" font-size="14" font-weight="700" text-anchor="middle">350 SQ FT/GAL (TWO COATS MANDATORY)</text>
    

  <!-- Bottom Technical Stamp & Code Rule -->
  <g transform="translate(45, 415)">
    <text x="0" y="0" fill="#475569" font-size="10" font-weight="600" letter-spacing="1">VERIFIED CALCULATION // OPEN-FORMULA ARCHITECTURE // ASTM &amp; IRC COMPLIANT</text>
  </g>
</svg>