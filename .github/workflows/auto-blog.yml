# Automated Daily Blog Publisher for Plumbright
# Runs every day at 04:00 UTC:
# 1. Runs generate-guide.mjs to generate the next zero-click resistant guide (dated today)
# 2. Pushes the article to Supabase database (status: published, live immediately)
# 3. Commits the newly generated markdown file back to the git repository
# 4. Git push & triggers deploy.yml which builds and deploys to Cloudflare Pages!

name: Daily Auto-Blog Generator & Publisher

on:
  schedule:
    # Runs every day at 04:00 UTC (07:00 AM Turkey time)
    - cron: "0 4 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

concurrency:
  group: auto-blog
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality audit existing guides
        run: npm run audit-guides

      # Gemini quota/network hiccups are transient: retry the whole generate+push step.
      - name: Generate and publish next guide
        run: |
          for i in 1 2 3; do
            node scripts/generate-guide.mjs --today --publish && exit 0
            echo "Generate attempt $i failed; retrying in 60s"
            git clean -fdq src/content/guides   # drop a half-published file so it cannot ship without its DB row
            sleep 60
          done
          exit 1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit and push new guide to repo
        id: commit
        run: |
          git config --global user.name "Plumbright Bot"
          git config --global user.email "bot@plumbright.com"
          git add src/content/guides/
          if git diff --staged --quiet; then
            echo "No new guide changes to commit."
          else
            slug=$(git diff --staged --name-only | head -1 | xargs basename | sed 's/\.md$//')
            echo "slug=$slug" >> "$GITHUB_OUTPUT"
            git commit -m "content: auto-generated daily zero-click guide"
            git pull --rebase origin main
            git push origin main
          fi

      # The run only counts as green when the new guide is really reachable on the live site.
      - name: Deploy and verify the guide is live
        if: steps.commit.outputs.slug != ''
        run: |
          gh workflow run deploy.yml --ref main
          sleep 15
          run_id=$(gh run list --workflow deploy.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run watch "$run_id" --exit-status
          url="https://${{ vars.CLOUDFLARE_PAGES_PROJECT }}.pages.dev/guides/${{ steps.commit.outputs.slug }}/"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            [ "$code" = "200" ] && echo "Live: $url" && exit 0
            echo "Got $code from $url; waiting"
            sleep 20
          done
          echo "Guide not reachable: $url"; exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open an issue if the daily run failed
        if: failure()
        run: |
          gh issue create --title "Daily auto-blog failed $(date -u +%F)"             --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
